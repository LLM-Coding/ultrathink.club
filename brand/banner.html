<!DOCTYPE html>
<!-- LinkedIn company cover / banner (1128x191). Rendered 2x -> 2256x382 via Playwright.
     Reuses wordmark.svg + rainbow gradient; tagline is swappable. -->
<html lang="en"><head><meta charset="utf-8"><style>
  *{margin:0; box-sizing:border-box}
  html,body{width:1128px; height:191px}
  #banner{
    width:1128px; height:191px;
    background:radial-gradient(760px 460px at 50% 46%,#111926 0%,#0a0e14 74%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:0 76px;
    font-family:ui-monospace,"JetBrains Mono","Fira Code",Consolas,monospace;
  }
  .art{display:flex; flex-direction:column; align-items:flex-start; flex:none}
  .wordmark{
    width:461px; height:64px;
    background:linear-gradient(90deg,#ff5f56,#ff8e3c,#ffbd2e,#f7e463,#3fb950,#39c5cf,#58a6ff,#a371f7);
    background-size:200% auto; background-position:24% 50%;
    -webkit-mask:url("../wordmark.svg") left/contain no-repeat;
            mask:url("../wordmark.svg") left/contain no-repeat;
    filter:drop-shadow(0 0 20px rgba(163,113,247,.2));
  }
  .suffix{
    align-self:flex-end; margin-top:2px;
    font-family:"Courier New",ui-monospace,Consolas,monospace; font-weight:700;
    color:#e6edf3; letter-spacing:1px; font-size:30px;
  }
  .suffix .dot{color:#3fb950}
  .tag{color:#c9d1d9; font-size:22px; letter-spacing:.5px; line-height:1.4; white-space:nowrap}
  .tag .p{color:#3fb950}
</style></head><body>
  <div id="banner">
    <div class="art">
      <div class="wordmark"></div>
      <div class="suffix"><span class="dot">.</span>club</div>
    </div>
    <div class="tag"><span class="p">~$</span> Wir denken noch eine Ebene tiefer.</div>
  </div>
</body></html>
