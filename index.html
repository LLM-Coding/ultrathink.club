<!DOCTYPE html>
<!-- ultrathink.club — coming soon — v0.1.1 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ultrathink.club — an AI think-tank community · coming soon</title>
  <meta name="description" content="ultrathink.club — an AI think-tank community. Coming soon. Request access.">
  <meta name="theme-color" content="#0a0e14">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ultrathink.club — coming soon">
  <meta property="og:description" content="An AI think-tank community. Coming soon — request access.">
  <meta property="og:url" content="https://ultrathink.club/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ultrathink.club — coming soon">
  <meta name="twitter:description" content="An AI think-tank community. Coming soon — request access.">

  <style>
    :root{
      --bg:#0a0e14; --txt:#c9d1d9; --dim:#6e7681; --grn:#3fb950; --white:#e6edf3;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; overflow-x:hidden;
      background:radial-gradient(900px 520px at 50% 36%,#10161f 0%,#0a0e14 70%);
      color:var(--txt);
      font-family:ui-monospace,"SFMono-Regular","JetBrains Mono","Fira Code",Consolas,monospace;
      min-height:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:40px 12px; text-align:center;
    }

    /* visually hidden, but readable by screen readers / crawlers */
    .sr-only{
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
    }

    @keyframes flow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

    .art{width:100%; max-width:1320px; display:flex; flex-direction:column; align-items:center}
    /* The wordmark is a pixel-perfect SVG mask (DOS Rebel "ultrathink"), filled with the
       animated rainbow gradient. Vector + resolution-independent → identical on every
       browser/OS/display-scaling, unlike monospace ASCII text which sub-pixel-drifts. */
    .wordmark{
      width:min(100%, 1180px);
      aspect-ratio:576 / 80;
      background:linear-gradient(90deg,#ff5f56,#ff8e3c,#ffbd2e,#f7e463,#3fb950,#39c5cf,#58a6ff,#a371f7,#ff5f56);
      background-size:200% auto;
      animation:flow 7s linear infinite;
      -webkit-mask:url("wordmark.svg") center / contain no-repeat;
              mask:url("wordmark.svg") center / contain no-repeat;
      filter:drop-shadow(0 0 22px rgba(163,113,247,.18));
    }
    .suffix{
      margin-top:6px; align-self:flex-end; margin-right:clamp(8px,4vw,46px);
      font-family:"Courier New",ui-monospace,Consolas,monospace; font-weight:700;
      color:var(--white); letter-spacing:1px; font-size:clamp(24px,5vw,52px);
    }
    .suffix .dot{color:var(--grn)}

    .line{margin-top:34px; font-size:clamp(13px,2.2vw,17px); color:var(--dim); min-height:1.4em}
    .line .p{color:var(--grn)}
    .line .slogan{color:var(--white)}
    .cursor{
      display:inline-block; width:.6em; height:1.1em; background:var(--grn);
      vertical-align:-3px; margin-left:6px; animation:blink 1.1s step-end infinite;
    }

    .cta{margin-top:42px}
    .btn{
      display:inline-block; font:inherit; font-size:15px; font-weight:700;
      color:#0a0e14; background:var(--grn); text-decoration:none;
      padding:13px 26px; border-radius:8px;
      box-shadow:0 6px 20px rgba(63,185,80,.25);
      transition:transform .12s, box-shadow .12s;
    }
    .btn:hover{transform:translateY(-2px); box-shadow:0 10px 28px rgba(63,185,80,.4)}
    .hint{margin-top:14px; font-size:12px; color:var(--dim)}

    footer{
      position:fixed; bottom:0; left:0; right:0; margin:0 auto; width:100%; max-width:1000px;
      padding:14px 16px; font-size:11px; color:#484f58;
      display:flex; justify-content:space-between; gap:8px;
    }
    footer a{color:#6e7681; text-decoration:none}
    footer a:hover{color:var(--txt)}
    @media(max-width:620px){
      footer{position:static; margin-top:50px; flex-direction:column; align-items:center}
    }

    @media (prefers-reduced-motion: reduce){
      pre.ascii{animation:none}
      .cursor{animation:none}
    }
  </style>
</head>
<body>
  <h1 class="sr-only">ultrathink.club — an AI think-tank community, coming soon</h1>

  <main class="art">
    <div class="wordmark" role="img" aria-label="ultrathink"></div>
    <div class="suffix"><span class="dot">.</span>club</div>
  </main>

  <p class="line"><span class="p">~$</span> <span class="slogan" id="slogan">an AI think-tank community — coming soon</span><span class="cursor" aria-hidden="true"></span></p>

  <div class="cta">
    <!-- Tally access-request form. With JS, embed.js opens it as a modal
         (data-tally-open); without JS, the href navigates to the form. -->
    <a class="btn" href="https://tally.so/r/WOqr7j" id="waitlist"
       data-tally-open="WOqr7j" data-tally-layout="modal"
       data-tally-width="640" data-tally-overlay="1"
       rel="noopener">→ Zugang anfragen</a>
    <div class="hint">Invite-only. Sag uns in einem Satz, warum du rein willst.</div>
  </div>

  <footer>
    <span>v0.1.1</span>
    <span>Not affiliated with Anthropic · © 2026 ultrathink.club</span>
  </footer>

  <script>
    // Progressive enhancement: show ONE random slogan per page load (no rotation — subtle).
    // Without JS, the static slogan in the HTML above is shown.
    (function () {
      var slogans = [
        "an AI think-tank community — coming soon",
        "Die erste Regel des ultrathink.club: Du denkst noch eine Ebene tiefer.",
        "Die zweite Regel des ultrathink.club: Du DENKST noch eine Ebene tiefer.",
        "Über den ultrathink.club spricht man nicht. Man promptet ihn.",
        "while (!agi) { think.harder(); }",
        "Status: thinking… (extended)",
        "404: club not found — yet.",
        "$ sudo make community",
        "Wir warten nicht auf AGI. Wir bauen schon mal den Club.",
        "Noch im Kontextfenster. Bald im echten Leben.",
        "Ein Think-Tank. Aber mit besserem WLAN.",
        "Wo Menschen und Modelle gemeinsam überlegen.",
        "git push origin community   # in progress",
        "Press any key to join… (Taste kommt bald.)"
      ];
      var el = document.getElementById('slogan');
      if (el) el.textContent = slogans[Math.floor(Math.random() * slogans.length)];
    })();
  </script>

  <!-- Tally — opens the access-request form as a modal (see CTA button). -->
  <script async src="https://tally.so/widgets/embed.js"></script>

  <!-- GoatCounter — privacy-friendly, cookieless analytics.
       Note: GoatCounter publishes no stable SRI hash and updates count.js occasionally,
       so Subresource Integrity is intentionally omitted. For SRI, self-host count.js. -->
  <script data-goatcounter="https://ultrathink.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
